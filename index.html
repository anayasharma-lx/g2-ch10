<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 10 · More About Multiplication</title>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ac:#D97706;--bg:#FDF6EE;--card:#fff;--ink:#1A2E2E;--ink2:#5F7A7A;--ok:#16A34A;--no:#DC2626;--r:20px}
html,body{width:100%;min-height:100vh;font-family:'Poppins',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
.hdr{width:100%;position:sticky;top:0;z-index:100;background:var(--ac);box-shadow:0 4px 24px rgba(0,0,0,.15)}
.hdr-in{max-width:640px;margin:0 auto;padding:14px 20px 0;text-align:center}
.ch-n{font-family:'Grandstander',cursive;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.ch-t{font-family:'Grandstander',cursive;font-size:clamp(18px,5vw,26px);font-weight:900;color:#fff;line-height:1.2;margin:2px 0 10px;text-shadow:0 2px 8px rgba(0,0,0,.1)}
.tabs{display:flex;gap:4px;max-width:280px;margin:0 auto;background:rgba(0,0,0,.1);border-radius:14px 14px 0 0;padding:4px 4px 0}
.tab{flex:1;padding:9px 0;text-align:center;font-family:'Grandstander',cursive;font-size:14px;font-weight:800;cursor:pointer;border-radius:12px 12px 0 0;color:rgba(255,255,255,.6);transition:.2s;user-select:none}
.tab.on{background:var(--bg);color:var(--ac)}
.tab:not(.on):hover{color:#fff;background:rgba(255,255,255,.08)}
.page{max-width:620px;margin:0 auto;padding:14px 14px 60px}
.pnl{display:none;flex-direction:column;gap:16px}.pnl.on{display:flex}
.card{background:var(--card);border-radius:var(--r);padding:20px 18px;box-shadow:0 3px 16px rgba(0,0,0,.06);position:relative;overflow:hidden}
.cb{position:absolute;top:0;left:0;bottom:0;width:5px;border-radius:var(--r) 0 0 var(--r);background:var(--ac)}
.ct{font-family:'Grandstander',cursive;font-size:15px;font-weight:800;padding-left:14px;margin-bottom:3px;line-height:1.3}
.cs{font-size:12px;color:var(--ink2);padding-left:14px;margin-bottom:14px;line-height:1.6}
/* stepper */
.cr{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cg{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.03);border-radius:12px;padding:8px 12px;border:1.5px solid rgba(0,0,0,.06)}
.cl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;min-width:48px}
.sb{width:34px;height:34px;border-radius:50%;border:none;font-size:18px;font-weight:900;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.sb:active{transform:scale(.88)}
.sv{font-family:'Grandstander',cursive;font-size:28px;font-weight:900;min-width:28px;text-align:center}
/* blocks */
.bx{background:rgba(0,0,0,.02);border-radius:14px;border:1.5px solid rgba(0,0,0,.06);padding:12px;min-height:60px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:14px}
.flat{display:grid;grid-template-columns:repeat(10,8px);gap:1px}.flat-c{width:8px;height:8px;border-radius:1px;opacity:.8}
.rod{display:flex;flex-direction:column;gap:1px}.rod-c{width:10px;height:10px;border-radius:1px;opacity:.8}
.units{display:flex;flex-wrap:wrap;gap:2px;max-width:58px;align-self:flex-end}.unit-c{width:10px;height:10px;border-radius:2px;opacity:.8}
.sep{width:1px;background:#D1D5DB;align-self:stretch;margin:0 3px}
/* options */
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font-family:'Grandstander',cursive;font-size:22px;font-weight:800;min-width:72px;height:54px;border-radius:16px;border:2.5px solid rgba(0,0,0,.08);background:#fff;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:.15s;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.opt:hover{border-color:var(--ac);transform:translateY(-2px)}
.opt.ok{background:#DCFCE7;border-color:var(--ok);color:#15803D;animation:pop .3s}
.opt.no{background:#FEE2E2;border-color:var(--no);color:var(--no);animation:shk .35s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{font-family:'Grandstander',cursive;font-size:14px;font-weight:700;min-height:20px;margin-top:10px;text-align:center}
.nbtn{font-family:'Grandstander',cursive;font-size:14px;font-weight:800;padding:10px 24px;border-radius:14px;border:none;background:var(--ac);color:#fff;cursor:pointer;margin-top:12px;box-shadow:0 3px 10px rgba(0,0,0,.12);transition:.15s}
.nbtn:hover{transform:translateY(-1px);opacity:.9}
.btn{font-family:'Grandstander',cursive;font-size:14px;font-weight:800;padding:10px 20px;border-radius:14px;border:none;cursor:pointer;transition:.15s;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn:hover{transform:translateY(-1px)}
.btn-p{background:var(--ac);color:#fff}
.btn-g{background:#fff;color:var(--ink2);border:1.5px solid rgba(0,0,0,.1)}
.btn-g:hover{border-color:var(--ac);color:var(--ac)}
.chal{background:rgba(0,0,0,.02);border-radius:16px;padding:14px;border:1.5px dashed rgba(0,0,0,.1);margin-top:10px}
.chal-q{font-family:'Grandstander',cursive;font-size:14px;font-weight:800;margin-bottom:10px}
.chal-q b{color:var(--ac);font-size:22px}
canvas{display:block;border-radius:10px}
/* drag & tap shared */
.tappable{cursor:pointer;user-select:none;transition:transform .15s}
.tappable:hover{transform:scale(1.08)}
.tappable:active{transform:scale(.92)}
/* misc */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-family:'Grandstander',cursive;font-size:14px;font-weight:800;padding:6px 18px;border-radius:30px}
.big{font-family:'Grandstander',cursive;font-weight:900;line-height:1;text-align:center}
</style>
</head>
<body>
<div class="hdr"><div class="hdr-in">
  <div class="ch-n">Chapter 10</div>
  <div class="ch-t">More About Multiplication</div>
  <div class="tabs">
    <div class="tab on" onclick="sw('learn')">Learn</div>
    <div class="tab" onclick="sw('practice')">Practice</div>
  </div>
</div></div>
<div class="page">

<div class="pnl on" id="p-learn">
  <div class="card"><div class="cb"></div>
    <div class="ct">Multiplication means equal groups</div>
    <div class="cs">Switch between two ways to see the same multiplication.</div>

    <!-- TOGGLE -->
    <div style="display:flex;background:rgba(0,0,0,.05);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px;max-width:280px">
      <button id="modeGroups" onclick="setMode('groups')" style="flex:1;padding:9px 0;font-family:Grandstander,cursive;font-size:13px;font-weight:800;border:none;border-radius:9px;cursor:pointer;background:var(--ac);color:#fff;transition:.2s">👫 Groups</button>
      <button id="modeNL" onclick="setMode('nl')" style="flex:1;padding:9px 0;font-family:Grandstander,cursive;font-size:13px;font-weight:800;border:none;border-radius:9px;cursor:pointer;background:transparent;color:var(--ink2);transition:.2s">〰️ Number Line</button>
    </div>

    <!-- CONTROLS (shared) -->
    <div class="cr">
      <div class="cg"><span class="cl" style="color:var(--ac)" id="lblA">Groups</span><button class="sb" style="background:var(--ac)" onclick="chM('a',-1)">−</button><span class="sv" style="color:var(--ac)" id="mA">3</span><button class="sb" style="background:var(--ac)" onclick="chM('a',1)">+</button></div>
      <div class="cg"><span class="cl" style="color:var(--ac)" id="lblB">Each</span><button class="sb" style="background:var(--ac)" onclick="chM('b',-1)">−</button><span class="sv" style="color:var(--ac)" id="mB">4</span><button class="sb" style="background:var(--ac)" onclick="chM('b',1)">+</button></div>
    </div>

    <!-- GROUPS VIEW -->
    <div id="viewGroups" style="margin-bottom:14px"></div>

    <!-- NUMBER LINE VIEW (hidden initially) -->
    <div id="viewNL" style="display:none;overflow-x:auto;padding-bottom:4px;margin-bottom:14px"></div>

    <!-- RESULT BOX (shared) -->
    <div style="background:rgba(0,0,0,.02);border-radius:14px;padding:14px;border:1.5px solid rgba(0,0,0,.06);text-align:center">
      <div style="font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:4px" id="mLbl">3 groups of 4</div>
      <div class="big" style="font-size:52px;color:var(--ac)" id="mTot">12</div>
      <div style="font-size:15px;font-weight:700;color:var(--ink2);margin-top:4px" id="mFact">3 × 4 = 12</div>
    </div>
  </div>
</div>
<div class="pnl" id="p-practice">
  <div class="card"><div class="cb"></div>
    <div class="ct">Solve the multiplication</div>
    <div class="cs">Look at the groups. Count them, then count each group. Pick the total.</div>
    <div id="wpScene" style="display:flex;flex-wrap:wrap;gap:8px;background:rgba(0,0,0,.02);border-radius:14px;padding:14px;border:1.5px solid rgba(0,0,0,.06);margin-bottom:12px;align-items:flex-start"></div>
    <div style="font-family:Grandstander,cursive;font-size:16px;font-weight:800;color:var(--ink);margin-bottom:12px" id="wpEq"></div>
    <div class="opts" id="wpO"></div>
    <div class="fb" id="wpF"></div>
    <button class="nbtn" onclick="nwWP()">Next →</button>
  </div>
</div>

</div>
<script>
function sw(n){document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.textContent.toLowerCase()===n)});document.querySelectorAll('.pnl').forEach(function(p){var a=p.id==='p-'+n;p.classList.toggle('on',a);p.style.display=a?'flex':'none'})}
document.getElementById('p-practice').style.display='none';
function pool4(ans,lo,hi){var s=new Set([ans]);var i=0;while(s.size<4&&i<50){i++;var w=ans+Math.round(Math.random()*8-4);if(w>=lo&&w<=hi&&w!==ans)s.add(w)}return[...s].sort(function(){return Math.random()-.5})}
function mkOpts(cid,items,correct,fid){var c=document.getElementById(cid);c.innerHTML='';items.forEach(function(n){var b=document.createElement('button');b.className='opt';b.textContent=n;b.onclick=function(){c.querySelectorAll('.opt').forEach(function(x){x.onclick=null});var fb=document.getElementById(fid);if(String(n)===String(correct)){b.classList.add('ok');fb.textContent='🎉 Correct!';fb.style.color='var(--ok)'}else{b.classList.add('no');fb.textContent='The answer is '+correct+'.';fb.style.color='var(--no)';c.querySelectorAll('.opt').forEach(function(x){if(String(x.textContent)===String(correct))x.classList.add('ok')})}};c.appendChild(b)})}

var mA=3,mB=4,curMode='groups';
var GEM=['🍎','⭐','🐶','🌸','🎈','🍕','🦋','🏀','🍊','🐱'];

function setMode(m){
  curMode=m;
  document.getElementById('modeGroups').style.cssText='flex:1;padding:9px 0;font-family:Grandstander,cursive;font-size:13px;font-weight:800;border:none;border-radius:9px;cursor:pointer;transition:.2s;background:'+(m==='groups'?'var(--ac)':'transparent')+';color:'+(m==='groups'?'#fff':'var(--ink2)');
  document.getElementById('modeNL').style.cssText='flex:1;padding:9px 0;font-family:Grandstander,cursive;font-size:13px;font-weight:800;border:none;border-radius:9px;cursor:pointer;transition:.2s;background:'+(m==='nl'?'var(--ac)':'transparent')+';color:'+(m==='nl'?'#fff':'var(--ink2)');
  document.getElementById('lblA').textContent=m==='groups'?'Groups':'Jump size';
  document.getElementById('lblB').textContent=m==='groups'?'Each':'Jumps';
  rndrM();
}

function chM(d,v){
  if(d==='a')mA=Math.max(1,Math.min(9,mA+v));
  else mB=Math.max(1,Math.min(9,mB+v));
  document.getElementById('mA').textContent=mA;
  document.getElementById('mB').textContent=mB;
  rndrM();
}

function rndrM(){
  var t=mA*mB;
  if(curMode==='groups'){
    document.getElementById('viewGroups').style.display='';
    document.getElementById('viewNL').style.display='none';
    var em=GEM[(mA*mB)%GEM.length];
    var el=document.getElementById('viewGroups');el.innerHTML='';
    var wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-wrap:wrap;gap:8px';
    for(var g=0;g<mA;g++){
      var box=document.createElement('div');
      box.style.cssText='background:rgba(0,0,0,.02);border:1.5px solid rgba(0,0,0,.08);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:3px;min-width:52px;align-content:flex-start;position:relative';
      for(var e=0;e<mB;e++){var s=document.createElement('span');s.style.cssText='font-size:20px;line-height:1';s.textContent=em;box.appendChild(s)}
      var lb=document.createElement('div');lb.style.cssText='width:100%;text-align:center;font-size:9px;font-weight:800;color:var(--ink2);margin-top:4px';lb.textContent=mB;box.appendChild(lb);
      wrap.appendChild(box);
    }
    el.appendChild(wrap);
    document.getElementById('mLbl').textContent=mA+' groups of '+mB;
  } else {
    document.getElementById('viewGroups').style.display='none';
    document.getElementById('viewNL').style.display='';
    // jump size = mA, jumps = mB
    var js=mA,jn=mB,mx=js*jn;
    var cmPx=Math.max(22,Math.min(40,Math.floor(320/mx)));
    var pad=14;var W=pad*2+mx*cmPx;var H=72;var lnY=52;
    var svg='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="min-width:'+W+'px">';
    svg+='<line x1="'+pad+'" y1="'+lnY+'" x2="'+(pad+mx*cmPx)+'" y2="'+lnY+'" stroke="#D1D5DB" stroke-width="2"/>';
    for(var i=0;i<=mx;i++){var x=pad+i*cmPx;var big=i%js===0;
      svg+='<line x1="'+x+'" y1="'+lnY+'" x2="'+x+'" y2="'+(lnY+(big?8:4))+'" stroke="'+(big?'#B45309':'#D1D5DB')+'" stroke-width="'+(big?2:1)+'"/>';
      if(big)svg+='<text x="'+x+'" y="'+(lnY+18)+'" text-anchor="middle" fill="#92400E" font-size="10" font-weight="700" font-family="Poppins,sans-serif">'+i+'</text>'}
    var ARC=['#7C3AED','#D97706','#16A34A','#DC2626','#2563EB','#DB2777','#0891B2','#EA580C'];
    for(var j=0;j<jn;j++){
      var x1=pad+j*js*cmPx;var x2=pad+(j+1)*js*cmPx;var mid=(x1+x2)/2;
      var ah=Math.min(28,js*cmPx*0.45);var cl=ARC[j%ARC.length];
      svg+='<path d="M'+x1+','+lnY+' Q'+mid+','+(lnY-ah)+' '+x2+','+lnY+'" fill="none" stroke="'+cl+'" stroke-width="2.5"/>';
      svg+='<circle cx="'+x2+'" cy="'+lnY+'" r="4" fill="'+cl+'"/>';
      svg+='<text x="'+mid+'" y="'+(lnY-ah-4)+'" text-anchor="middle" fill="'+cl+'" font-size="9" font-weight="700" font-family="Poppins,sans-serif">+'+js+'</text>';
    }
    svg+='<circle cx="'+pad+'" cy="'+lnY+'" r="4" fill="var(--ink)"/>';
    svg+='</svg>';
    document.getElementById('viewNL').innerHTML=svg;
    document.getElementById('mLbl').textContent=jn+' jump'+(jn>1?'s':'')+' of '+js;
  }
  document.getElementById('mTot').textContent=t;
  document.getElementById('mFact').textContent=mA+' × '+mB+' = '+t;
}
rndrM();

/* Practice: visual groups quiz */
var PEMS=['🍎','⭐','🌸','🎈','🍊','🍕','🐶','🦋'];
var wpa=0;
function nwWP(){
  var a=Math.floor(Math.random()*5)+2;
  var b=Math.floor(Math.random()*5)+2;
  wpa=a*b;
  var em=PEMS[Math.floor(Math.random()*PEMS.length)];
  document.getElementById('wpF').textContent='';
  document.getElementById('wpEq').textContent=a+' × '+b+' = ?';
  var sc=document.getElementById('wpScene');sc.innerHTML='';
  for(var g=0;g<a;g++){
    var box=document.createElement('div');
    box.style.cssText='background:#fff;border:1.5px solid rgba(0,0,0,.08);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:3px;min-width:52px;align-content:flex-start';
    for(var i=0;i<b;i++){var s=document.createElement('span');s.style.cssText='font-size:22px;line-height:1';s.textContent=em;box.appendChild(s)}
    var lb=document.createElement('div');lb.style.cssText='width:100%;text-align:center;font-size:9px;font-weight:800;color:var(--ink2);margin-top:3px';lb.textContent=b+' '+em;box.appendChild(lb);
    sc.appendChild(box);
  }
  mkOpts('wpO',pool4(wpa,2,81),wpa,'wpF');
}
nwWP();

</script>
</body>
</html>
